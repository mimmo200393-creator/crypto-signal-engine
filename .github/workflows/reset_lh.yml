name: Reset LH Signals (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Archivia e resetta lh_signals
        run: |
          python3 << 'EOF'
          import sqlite3

          conn = sqlite3.connect('data/signals.db')
          cur = conn.cursor()

          cur.execute("CREATE TABLE IF NOT EXISTS lh_signals_archive AS SELECT * FROM lh_signals WHERE 0")
          cur.execute("INSERT INTO lh_signals_archive SELECT * FROM lh_signals")
          conn.commit()

          orig = cur.execute("SELECT COUNT(*) FROM lh_signals").fetchone()[0]
          arch = cur.execute("SELECT COUNT(*) FROM lh_signals_archive").fetchone()[0]
          print(f"Righe originali: {orig}, archiviate: {arch}")
          assert orig <= arch, "Mismatch nell'archiviazione!"

          cur.execute("DELETE FROM lh_signals")
          conn.commit()

          rimaste = cur.execute("SELECT COUNT(*) FROM lh_signals").fetchone()[0]
          print(f"lh_signals dopo reset: {rimaste} righe")
          conn.close()
          EOF

      - name: Commit del DB aggiornato
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/signals.db
          git commit -m "Reset LH signals (archiviati in lh_signals_archive)"
          git push
